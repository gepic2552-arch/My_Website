<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome to Hifza's Website</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", "Poppins", Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: #fff0f5;
            width: 90%;
            max-width: 460px;
            border-radius: 22px;
            padding: 35px 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(255, 105, 180, 0.3);
        }

        .avatar {
            width: 120px;
            height: 120px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6f91, #ff9a9e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 46px;
            color: white;
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.4);
        }

        h1 {
            font-size: 32px;
            color: #c2185b;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 16px;
            color: #ad1457;
            margin-bottom: 22px;
        }

        .about {
            font-size: 15px;
            line-height: 1.7;
            color: #6a1b4d;
            margin-bottom: 28px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff5f9e, #ff85b3);
            color: white;
            box-shadow: 0 6px 15px rgba(255, 105, 180, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(255, 105, 180, 0.5);
        }

        .btn-outline {
            border: 2px solid #ff85b3;
            color: #c2185b;
            background: transparent;
        }

        .btn-outline:hover {
            background: #ff85b3;
            color: white;
        }

        footer {
            margin-top: 30px;
            font-size: 13px;
            color: #ad1457;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">💖</div>

        <h1>Welcome</h1>
        <p class="tagline">Sweet • Stylish • Confident</p>

        <p class="about">
            A soft, elegant landing page designed with a pink aesthetic.
            Simple, modern, and full of positive vibes.
        </p>

        <div class="buttons">
            <a href="#" class="btn btn-primary">Get Started</a>
            <a href="#" class="btn btn-outline">Explore</a>
        </div>

        <footer>
            Made with love ✨
        </footer>
    </div>

</body>
</html>
